# USB Device Stack (legacy)
CONFIG_USB_DEVICE_STACK=y
CONFIG_DEPRECATION_TEST=y
CONFIG_USB_DEVICE_PRODUCT="XIAO USB Microphone"
CONFIG_USB_DEVICE_MANUFACTURER="Seeed"
CONFIG_USB_DEVICE_PID=0x0009
CONFIG_USB_DEVICE_VID=0x2886
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_USB_DEVICE_STACK_NEXT=n

# USB Audio
CONFIG_USB_DEVICE_AUDIO=y

# Audio/DMIC support
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Console and logging
CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_USB_DRIVER_LOG_LEVEL_WRN=y
CONFIG_USB_DEVICE_LOG_LEVEL_INF=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BUFFER_SIZE=4096

# Net buf for USB
CONFIG_NET_BUF=y

# System
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
